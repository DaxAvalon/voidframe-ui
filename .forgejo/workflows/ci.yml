name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build library
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v3
        with:
          name: voidframe-dist
          path: |
            dist/voidframe.es.js
            dist/voidframe.cjs.js
            dist/voidframe.css
            dist/types/
          retention-days: 30

  release:
    name: Publish release artifacts
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Package dist tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "voidframe-${TAG}.tgz" \
            dist/voidframe.es.js \
            dist/voidframe.cjs.js \
            dist/voidframe.css \
            dist/types/ \
            package.json README.md LICENSE

      - name: Upload release tarball
        uses: actions/upload-artifact@v3
        with:
          name: voidframe-release-${{ github.ref_name }}
          path: voidframe-*.tgz
          retention-days: 90
