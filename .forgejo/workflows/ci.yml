name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint (voidframe rules)
        run: npm run lint:voidframe -- src/

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Verify dist
        run: |
          test -f dist/voidframe.es.js  || { echo "Missing voidframe.es.js"; exit 1; }
          test -f dist/charts.es.js     || { echo "Missing charts.es.js"; exit 1; }
          test -f dist/dev.es.js        || { echo "Missing dev.es.js"; exit 1; }
          test -f dist/voidframe.css    || { echo "Missing voidframe.css"; exit 1; }
          echo "All dist files present:"
          ls -lh dist/*.es.js dist/*.cjs.js dist/voidframe.css

      - name: Dry-run pack
        run: npm pack --dry-run

      # Artifact uploads require Forgejo artifact storage to be
      # configured. If it's not, these steps fail silently (continue-on-error).
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload dist
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: voidframe-dist
          path: |
            dist/voidframe.es.js
            dist/voidframe.cjs.js
            dist/charts.es.js
            dist/charts.cjs.js
            dist/dev.es.js
            dist/dev.cjs.js
            dist/voidframe.css
          retention-days: 30

  release:
    name: Publish release artifacts
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          test -f dist/voidframe.es.js  || { echo "Missing voidframe.es.js"; exit 1; }
          test -f dist/charts.es.js     || { echo "Missing charts.es.js"; exit 1; }
          test -f dist/dev.es.js        || { echo "Missing dev.es.js"; exit 1; }
          test -f dist/voidframe.css    || { echo "Missing voidframe.css"; exit 1; }

      - name: Check bundle size
        run: npm run size

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Package dist tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "voidframe-${TAG}.tgz" \
            dist/voidframe.es.js \
            dist/voidframe.cjs.js \
            dist/charts.es.js \
            dist/charts.cjs.js \
            dist/dev.es.js \
            dist/dev.cjs.js \
            dist/voidframe.css \
            package.json README.md LICENSE

      - name: Upload release tarball
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: voidframe-release-${{ github.ref_name }}
          path: voidframe-*.tgz
          retention-days: 90

      # npm publish is gated behind the NPM_TOKEN secret.
      # To enable: add NPM_TOKEN to Forgejo repository secrets,
      # then create .npmrc with registry auth. Until then this
      # step is skipped automatically.
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
