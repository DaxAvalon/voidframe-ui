name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      # Audit runtime (non-dev) dependencies at maximum strictness.
      # Dev-only vulnerabilities (vite / vitest / esbuild dev-server
      # advisories) do not ship to consumers, so we don't gate CI on them
      # here. The dev toolchain is tracked separately and upgraded in
      # its own PR so a test-harness major jump never blocks a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Informational: log dev-dep advisories without failing the build.
      # `|| true` swallows the non-zero exit; the output still surfaces
      # in the job log for visibility.
      - name: Audit dev dependencies (informational)
        run: npm audit --include=dev --audit-level=high || true

      - name: Lint (voidframe rules)
        run: npm run lint:voidframe -- src/

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Verify dist
        run: |
          ENTRIES="voidframe charts dev tokens testing primitives core layout navigation forms data activity overlays media animation icons chat specialty interactive reactflow compat-shadcn"
          FAIL=0
          for name in $ENTRIES; do
            for ext in es.js cjs.js; do
              test -f "dist/${name}.${ext}" || { echo "MISSING dist/${name}.${ext}"; FAIL=1; }
            done
          done
          test -f "dist/types/index.d.ts" || { echo "MISSING dist/types/index.d.ts"; FAIL=1; }
          test -f "dist/types/charts/index.d.ts" || { echo "MISSING dist/types/charts/index.d.ts"; FAIL=1; }
          test -f "dist/types/dev/index.d.ts" || { echo "MISSING dist/types/dev/index.d.ts"; FAIL=1; }
          test -f "dist/types/tokens.d.ts" || { echo "MISSING dist/types/tokens.d.ts"; FAIL=1; }
          test -f "dist/types/testing/index.d.ts" || { echo "MISSING dist/types/testing/index.d.ts"; FAIL=1; }
          for name in primitives core layout navigation forms data activity overlays media animation icons chat specialty interactive reactflow compat-shadcn; do
            test -f "dist/types/subpaths/${name}.d.ts" || { echo "MISSING dist/types/subpaths/${name}.d.ts"; FAIL=1; }
          done
          test -f dist/voidframe.css || { echo "MISSING dist/voidframe.css"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || exit 1
          echo "All dist files present:"
          ls -lh dist/*.es.js dist/*.cjs.js dist/voidframe.css

      - name: Dry-run pack
        run: npm pack --dry-run

      # Artifact upload steps intentionally omitted. This library
      # publishes to npm via `npm publish` from a maintainer workstation,
      # not from CI, and coverage/dist are regenerated on every run —
      # there's nothing downstream that consumes them. Add back if
      # Forgejo artifact storage is ever wired up.

  release:
    name: Publish release artifacts
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          test -f dist/voidframe.es.js  || { echo "Missing voidframe.es.js"; exit 1; }
          test -f dist/charts.es.js     || { echo "Missing charts.es.js"; exit 1; }
          test -f dist/dev.es.js        || { echo "Missing dev.es.js"; exit 1; }
          test -f dist/voidframe.css    || { echo "Missing voidframe.css"; exit 1; }

      - name: Check bundle size
        run: npm run size

      - name: Dry-run pack
        run: npm pack --dry-run

      # npm publish is gated behind the NPM_TOKEN secret.
      # By default, maintainers publish from a workstation with `npm publish`
      # so this step no-ops. If you want CI-driven publish, add NPM_TOKEN to
      # Forgejo repository secrets.
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
