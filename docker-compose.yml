# Voidframe dev environment.
# All npm/node activity happens in these containers — never on the host.
#
#   docker compose up demo              # live demo on http://localhost:5173
#   docker compose run --rm typecheck   # one-shot tsc --noEmit
#   docker compose run --rm build       # production build
#   docker compose run --rm shell       # interactive shell
#
# Or use the Makefile: `make dev`, `make check`, `make build`, `make sh`.

services:
  # Base anchor — other services extend this.
  _base: &base
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: voidframe-dev:latest
    working_dir: /app
    volumes:
      - .:/app
      # Named volume for node_modules so the host bind-mount doesn't
      # shadow the image's pre-installed deps.
      - voidframe_node_modules:/app/node_modules
    environment:
      - CI=false
      - CHOKIDAR_USEPOLLING=true  # reliable file-watch across Docker on Linux
      - WATCHPACK_POLLING=true

  demo:
    <<: *base
    command: npm run demo -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true

  docs:
    <<: *base
    command: npm run docs -- --host 0.0.0.0 --port 5175
    ports:
      - "5175:5175"
    stdin_open: true
    tty: true

  dev:
    <<: *base
    command: npm run dev -- --host 0.0.0.0 --port 5174
    ports:
      - "5174:5174"

  typecheck:
    <<: *base
    command: npm run typecheck

  test:
    <<: *base
    command: npm test

  test-watch:
    <<: *base
    command: npm run test:watch
    stdin_open: true
    tty: true

  coverage:
    <<: *base
    command: npm run test:coverage

  build:
    <<: *base
    command: npm run build

  shell:
    <<: *base
    command: sh
    stdin_open: true
    tty: true

  # One-shot to refresh node_modules after package.json changes.
  # Run: `docker compose run --rm install`
  install:
    <<: *base
    command: npm install --no-fund --no-audit

volumes:
  voidframe_node_modules:
