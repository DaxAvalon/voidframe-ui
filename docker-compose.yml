# Voidframe dev environment.
# All npm/node activity happens in these containers — never on the host.
#
#   docker compose up demo              # live demo on http://localhost:5173
#   docker compose run --rm typecheck   # one-shot tsc --noEmit
#   docker compose run --rm build       # production build
#   docker compose run --rm shell       # interactive shell
#
# Or use the Makefile: `make dev`, `make check`, `make build`, `make sh`.

services:
  # Base anchor — other services extend this.
  _base: &base
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: voidframe-dev:latest
    working_dir: /app
    volumes:
      - .:/app
      # Named volume for node_modules so the host bind-mount doesn't
      # shadow the image's pre-installed deps.
      - voidframe_node_modules:/app/node_modules
    environment:
      - CI=false
      - CHOKIDAR_USEPOLLING=true  # reliable file-watch across Docker on Linux
      - WATCHPACK_POLLING=true

  demo:
    <<: *base
    command: npm run demo -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true

  docs:
    <<: *base
    command: npm run docs -- --host 0.0.0.0 --port 5175
    ports:
      - "5175:5175"
    stdin_open: true
    tty: true

  dev:
    <<: *base
    command: npm run dev -- --host 0.0.0.0 --port 5174
    ports:
      - "5174:5174"

  typecheck:
    <<: *base
    command: npm run typecheck

  test:
    <<: *base
    command: npm test

  test-watch:
    <<: *base
    command: npm run test:watch
    stdin_open: true
    tty: true

  coverage:
    <<: *base
    command: npm run test:coverage

  build:
    <<: *base
    command: npm run build

  shell:
    <<: *base
    command: sh
    stdin_open: true
    tty: true

  # One-shot to refresh node_modules after package.json changes.
  # Run: `docker compose run --rm install`
  install:
    <<: *base
    command: npm install --no-fund --no-audit

  # Dedicated e2e harness Vite server — Playwright-driven interaction
  # tests target this port. Run with `make e2e-ui` for Playwright UI
  # mode, or let the `e2e` service spawn it automatically via webServer.
  e2e-serve:
    <<: *base
    command: npm run e2e:serve
    ports:
      - "5176:5176"

  # One-shot Playwright run. Uses the official Microsoft image which
  # ships glibc-linked Chromium + Firefox + Webkit binaries pre-installed
  # (alpine in the *base image can't run those). A dedicated
  # node_modules volume keeps the jammy install isolated from the
  # alpine one — no musl↔glibc native-binary mismatch.
  # Bind-mount the repo read-write so Playwright can write
  # playwright-report / test-results / snapshots back to the host.
  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    volumes:
      - .:/app
      - voidframe_e2e_node_modules:/app/node_modules
    environment:
      - CI=true
    # On first run npm installs into the dedicated volume (~60s).
    # Subsequent runs reuse it — reset via `docker compose down -v`.
    command: sh -c "[ -x node_modules/.bin/playwright ] || npm install --no-audit --no-fund; npm run test:e2e"

volumes:
  voidframe_node_modules:
  voidframe_e2e_node_modules:
