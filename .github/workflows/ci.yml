name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      # Audit runtime (non-dev) dependencies at maximum strictness.
      # Dev-only vulnerabilities (vite / vitest / esbuild dev-server
      # advisories) do not ship to consumers, so we don't gate CI on them
      # here. The dev toolchain is tracked separately and upgraded in
      # its own PR so a test-harness major jump never blocks a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Informational: log dev-dep advisories without failing the build.
      # `|| true` swallows the non-zero exit; the output still surfaces
      # in the job log for visibility.
      - name: Audit dev dependencies (informational)
        run: npm audit --include=dev --audit-level=high || true

      - name: Lint (voidframe rules)
        run: npm run lint:voidframe -- src/

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Build library
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - name: Verify dist
        run: |
          ENTRIES="voidframe charts dev tokens testing primitives core layout navigation forms data activity overlays media animation icons chat specialty interactive reactflow compat-shadcn"
          FAIL=0
          for name in $ENTRIES; do
            for ext in es.js cjs.js; do
              test -f "dist/${name}.${ext}" || { echo "MISSING dist/${name}.${ext}"; FAIL=1; }
            done
          done
          test -f "dist/types/index.d.ts" || { echo "MISSING dist/types/index.d.ts"; FAIL=1; }
          test -f "dist/types/charts/index.d.ts" || { echo "MISSING dist/types/charts/index.d.ts"; FAIL=1; }
          test -f "dist/types/dev/index.d.ts" || { echo "MISSING dist/types/dev/index.d.ts"; FAIL=1; }
          test -f "dist/types/tokens.d.ts" || { echo "MISSING dist/types/tokens.d.ts"; FAIL=1; }
          test -f "dist/types/testing/index.d.ts" || { echo "MISSING dist/types/testing/index.d.ts"; FAIL=1; }
          for name in primitives core layout navigation forms data activity overlays media animation icons chat specialty interactive reactflow compat-shadcn; do
            test -f "dist/types/subpaths/${name}.d.ts" || { echo "MISSING dist/types/subpaths/${name}.d.ts"; FAIL=1; }
          done
          test -f dist/voidframe.css || { echo "MISSING dist/voidframe.css"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || exit 1
          echo "All dist files present:"
          ls -lh dist/*.es.js dist/*.cjs.js dist/voidframe.css

      - name: Dry-run pack
        run: npm pack --dry-run

  publish:
    name: Publish to npm (trusted publishing)
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Trusted publishing requires npm >= 11.5.1 which ships with Node 22+.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          ENTRIES="voidframe charts dev tokens testing primitives core layout navigation forms data activity overlays media animation icons chat specialty interactive reactflow compat-shadcn"
          for name in $ENTRIES; do
            test -f "dist/${name}.es.js" || { echo "MISSING dist/${name}.es.js"; exit 1; }
            test -f "dist/${name}.cjs.js" || { echo "MISSING dist/${name}.cjs.js"; exit 1; }
          done
          test -f dist/voidframe.css || { echo "MISSING dist/voidframe.css"; exit 1; }
          echo "All dist files present."

      # OIDC trusted publishing — no NPM_TOKEN secret needed.
      # npm CLI auto-detects the GitHub OIDC environment and requests
      # a short-lived publish token from npmjs.com. Provenance
      # attestations are generated automatically.
      - name: Publish
        run: npm publish --access public
