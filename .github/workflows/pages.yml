name: Deploy docs to GitHub Pages

on:
  # Auto-deploy on every push to main so the published docs stay in sync
  # with the default branch. The workflow is idempotent — re-running
  # against the same commit just re-uploads the same artifact.
  push:
    branches: [main]

  # Re-deploy on every release so tagged versions have fresh docs.
  release:
    types: [published]

  # Manual trigger, e.g. to redeploy after a Pages settings change.
  workflow_dispatch:

# Pages deploy uses GitHub's OIDC token + Pages-specific permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Later pushes skip the queue until
# the current deploy finishes; cancel-in-progress=false keeps the
# running deploy intact (don't interrupt mid-deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build docs
        env:
          # Pages serves this repo at https://daxavalon.github.io/voidframe-ui/.
          # docs/vite.config.ts reads this env var to prefix every emitted
          # asset path with the subpath.
          DOCS_BASE_PATH: /voidframe-ui/
          # generate-llms.mjs reads this for sitemap URLs and canonical links.
          DOCS_BASE_URL: https://daxavalon.github.io/voidframe-ui/
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
